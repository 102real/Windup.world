<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090c" />
    <meta
      name="description"
      content="BODA — 바라보는 동안 시간이 멈추는 3D 액션 로그라이트"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />
    <link
      rel="preload"
      as="image"
      href="./assets/ui/title-boda-desktop.webp"
      media="(min-width: 701px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="./assets/ui/title-boda-mobile.webp"
      media="(max-width: 700px)"
      fetchpriority="high"
    />
    <title>BODA — 시선의 던전</title>
    <style id="boda-critical-title-style">
      html,
      body {
        width: 100%;
        height: 100%;
        min-width: 320px;
        min-height: 480px;
        margin: 0;
        overflow: hidden;
        background: #09090c;
      }

      #root {
        position: fixed;
        z-index: 1;
        inset: 0;
      }

      #boda-static-title {
        position: fixed;
        z-index: 2;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #09090c;
        color: #f7f7fa;
        font-family:
          'Arial Rounded MT Bold', 'Trebuchet MS', 'Noto Sans KR', system-ui,
          sans-serif;
        isolation: isolate;
      }

      #boda-static-title picture,
      #boda-static-title picture::after {
        position: absolute;
        inset: 0;
      }

      #boda-static-title picture {
        z-index: -2;
      }

      #boda-static-title picture::after {
        background:
          radial-gradient(
            circle at center,
            transparent 28%,
            rgba(5, 5, 8, 0.52)
          ),
          linear-gradient(0deg, rgba(7, 7, 10, 0.76), transparent 52%);
        content: '';
      }

      #boda-static-title img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .boda-static-title__content {
        padding: 1.5rem;
        text-align: center;
        text-shadow: 0 6px 20px rgba(0, 0, 0, 0.86);
      }

      .boda-static-title__eyebrow {
        margin: 0;
        font-size: clamp(0.65rem, 1.2vw, 0.82rem);
        font-weight: 800;
        letter-spacing: 0.32em;
      }

      .boda-static-title__name {
        margin: 0.08em 0 0;
        color: #f12b55;
        font-size: clamp(5rem, 15vw, 10rem);
        letter-spacing: 0.08em;
        line-height: 0.9;
        text-shadow:
          0 7px 0 #4e0717,
          0 14px 30px rgba(0, 0, 0, 0.86);
      }

      .boda-static-title__subtitle {
        margin: 1.3rem 0 0;
        font-size: clamp(0.95rem, 2vw, 1.22rem);
        font-weight: 750;
      }

      #boda-static-message {
        margin: 1rem 0 0;
        color: #ffb3c3;
        font-size: 0.76rem;
      }

      #boda-static-retry {
        min-width: 9rem;
        min-height: 2.7rem;
        padding: 0.55rem 1rem;
        margin-top: 0.8rem;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 10px;
        background: linear-gradient(180deg, #ff5577, #d4143b);
        color: #fff;
        font: inherit;
        font-size: 0.78rem;
        font-weight: 800;
        cursor: pointer;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 700px) {
        .boda-static-title__content {
          transform: translateY(-6vh);
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-Izd5ONW0.js"></script>
  </head>
  <body>
    <div id="boda-static-title" aria-label="BODA 타이틀 화면">
      <picture aria-hidden="true">
        <source
          media="(max-width: 700px)"
          srcset="./assets/ui/title-boda-mobile.webp"
        />
        <img
          src="./assets/ui/title-boda-desktop.webp"
          alt=""
          width="1920"
          height="1080"
          fetchpriority="high"
        />
      </picture>
      <section class="boda-static-title__content">
        <p class="boda-static-title__eyebrow">THE LAST GAZE</p>
        <h1 class="boda-static-title__name">BODA</h1>
        <p class="boda-static-title__subtitle">눈을 거두면, 사냥이 시작된다</p>
        <p id="boda-static-message" role="alert" hidden></p>
        <button id="boda-static-retry" type="button" hidden>다시 시도</button>
      </section>
    </div>
    <div id="root"></div>
  </body>
</html>
