<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#09090c" />
    <meta
      name="description"
      content="BODA — 바라보는 동안 시간이 멈추는 3D 액션 로그라이트"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />
    <link
      rel="preload"
      as="image"
      href="./assets/ui/title-boda-desktop.webp"
      media="(min-width: 701px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="./assets/ui/title-boda-mobile.webp"
      media="(max-width: 700px)"
      fetchpriority="high"
    />
    <title>BODA — 시선의 던전</title>
    <style id="boda-critical-title-style">
      html,
      body {
        width: 100%;
        height: 100%;
        min-width: 320px;
        min-height: 480px;
        margin: 0;
        overflow: hidden;
        background: #09090c;
      }

      #root {
        position: fixed;
        z-index: 1;
        inset: 0;
      }

      #boda-static-title {
        position: fixed;
        z-index: 2;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #09090c;
        color: #f7f7fa;
        font-family:
          'Arial Rounded MT Bold', 'Trebuchet MS', 'Noto Sans KR', system-ui,
          sans-serif;
        isolation: isolate;
      }

      #boda-static-title picture,
      #boda-static-title picture::after {
        position: absolute;
        inset: 0;
      }

      #boda-static-title picture {
        z-index: -2;
      }

      #boda-static-title picture::after {
        background:
          radial-gradient(
            circle at center,
            transparent 28%,
            rgba(5, 5, 8, 0.52)
          ),
          linear-gradient(0deg, rgba(7, 7, 10, 0.76), transparent 52%);
        content: '';
      }

      #boda-static-title img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .boda-static-title__content {
        padding: 1.5rem;
        text-align: center;
        text-shadow: 0 6px 20px rgba(0, 0, 0, 0.86);
      }

      .boda-static-title__eyebrow {
        margin: 0;
        font-size: clamp(0.65rem, 1.2vw, 0.82rem);
        font-weight: 800;
        letter-spacing: 0.32em;
      }

      .boda-static-title__name {
        margin: 0.08em 0 0;
        color: #f12b55;
        font-size: clamp(5rem, 15vw, 10rem);
        letter-spacing: 0.08em;
        line-height: 0.9;
        text-shadow:
          0 7px 0 #4e0717,
          0 14px 30px rgba(0, 0, 0, 0.86);
      }

      .boda-static-title__subtitle {
        margin: 1.3rem 0 0;
        font-size: clamp(0.95rem, 2vw, 1.22rem);
        font-weight: 750;
      }

      #boda-static-start {
        position: relative;
        display: grid;
        width: min(40rem, 88vw);
        min-width: 0;
        min-height: 3.8rem;
        padding: 0.72rem 0;
        margin: clamp(1.5rem, 4vh, 2.8rem) auto 0;
        overflow: hidden;
        grid-template-columns: 1fr auto 1fr;
        gap: 0.95rem;
        align-items: center;
        border: 2px solid transparent;
        border-radius: 12px;
        outline: 1px solid rgba(255, 148, 170, 0.32);
        outline-offset: 4px;
        background:
          linear-gradient(180deg, rgba(34, 32, 39, 0.9), rgba(12, 12, 17, 0.94))
            padding-box,
          linear-gradient(90deg, #f32955 0%, #ffe4eb 50%, #f32955 100%)
            border-box;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.2),
          inset 0 -1px 0 rgba(255, 56, 98, 0.28),
          0 4px 0 #650b24,
          0 12px 26px rgba(4, 4, 7, 0.58),
          0 0 16px rgba(241, 43, 85, 0.34),
          0 0 38px rgba(241, 43, 85, 0.18);
        color: #fff;
        font: inherit;
        font-size: clamp(0.8rem, 1.5vw, 1rem);
        font-weight: 850;
        letter-spacing: 0.12em;
        text-shadow:
          0 2px 0 #09090d,
          0 0 12px rgba(255, 255, 255, 0.14);
        cursor: pointer;
        animation: boda-static-prompt 1.7s ease-in-out infinite alternate;
        transition:
          transform 140ms ease,
          background 180ms ease,
          box-shadow 180ms ease,
          filter 180ms ease;
      }

      #boda-static-start::after {
        position: absolute;
        inset: 2px;
        border-radius: 10px;
        background: linear-gradient(
          112deg,
          transparent 26%,
          rgba(255, 255, 255, 0.16) 48%,
          transparent 70%
        );
        content: '';
        pointer-events: none;
        transform: translateX(-130%);
        transition: transform 420ms ease;
      }

      .boda-static-start__label {
        position: relative;
        z-index: 1;
        white-space: nowrap;
      }

      .boda-static-start__rail {
        position: relative;
        z-index: 1;
        height: 3px;
        border-radius: 0 999px 999px 0;
        background: linear-gradient(
          90deg,
          #f32955 0%,
          #ff315d 48%,
          #ffe4eb 100%
        );
        box-shadow:
          0 0 7px rgba(255, 255, 255, 0.45),
          0 0 13px rgba(241, 43, 85, 0.72);
        transition:
          background 180ms ease,
          box-shadow 180ms ease;
      }

      .boda-static-start__rail:first-child {
        margin-left: -2px;
      }

      .boda-static-start__rail:last-child {
        margin-right: -2px;
        border-radius: 999px 0 0 999px;
        background: linear-gradient(
          90deg,
          #ffe4eb 0%,
          #ff315d 52%,
          #f32955 100%
        );
      }

      #boda-static-start:hover:not(:disabled),
      #boda-static-start:focus-visible {
        outline-color: rgba(255, 228, 235, 0.72);
        background:
          linear-gradient(
              180deg,
              rgba(63, 57, 66, 0.96),
              rgba(19, 18, 24, 0.98)
            )
            padding-box,
          linear-gradient(90deg, #ff315d 0%, #fff 50%, #ff315d 100%) border-box;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.38),
          inset 0 -1px 0 rgba(255, 73, 112, 0.52),
          0 6px 0 #780d2b,
          0 16px 34px rgba(4, 4, 7, 0.66),
          0 0 24px rgba(255, 255, 255, 0.28),
          0 0 42px rgba(241, 43, 85, 0.62);
        filter: brightness(1.08);
        transform: translateY(-2px);
        animation: none;
      }

      #boda-static-start:hover:not(:disabled)::after,
      #boda-static-start:focus-visible::after {
        transform: translateX(130%);
      }

      #boda-static-start:hover:not(:disabled)
        .boda-static-start__rail:first-child,
      #boda-static-start:focus-visible .boda-static-start__rail:first-child {
        background: linear-gradient(90deg, #ff315d, #fff);
      }

      #boda-static-start:hover:not(:disabled)
        .boda-static-start__rail:last-child,
      #boda-static-start:focus-visible .boda-static-start__rail:last-child {
        background: linear-gradient(90deg, #fff, #ff315d);
      }

      #boda-static-start:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 4px;
      }

      #boda-static-start:active:not(:disabled) {
        outline-color: rgba(255, 112, 142, 0.4);
        box-shadow:
          inset 0 3px 8px rgba(0, 0, 0, 0.64),
          inset 0 0 18px rgba(241, 43, 85, 0.2),
          0 1px 0 #650b24,
          0 5px 12px rgba(4, 4, 7, 0.62);
        filter: brightness(0.96);
        transform: translateY(3px);
      }

      #boda-static-start:disabled {
        cursor: wait;
        opacity: 0.68;
        transform: none;
        animation: none;
      }

      #boda-static-title[data-state='loading'] .boda-static-title__content {
        visibility: hidden;
      }

      #boda-static-loading {
        position: absolute;
        z-index: 2;
        top: 50%;
        left: 50%;
        display: grid;
        width: min(88vw, 35rem);
        place-items: center;
        padding: clamp(1.5rem, 4vw, 2.6rem);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 16px;
        background: linear-gradient(
          155deg,
          rgba(48, 48, 56, 0.96),
          rgba(14, 14, 19, 0.97)
        );
        box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, 0.66);
        text-align: center;
        transform: translate(-50%, -50%);
      }

      .boda-static-loader {
        position: relative;
        width: 3.6rem;
        height: 3.6rem;
        border: 3px solid rgba(255, 255, 255, 0.17);
        border-top-color: #f12b55;
        border-radius: 50%;
        animation: boda-static-spin 0.9s linear infinite;
      }

      .boda-static-loader::after {
        position: absolute;
        inset: 0.75rem;
        border: 2px solid rgba(255, 255, 255, 0.18);
        border-right-color: #fff;
        border-radius: 50%;
        content: '';
        animation: boda-static-spin 0.65s linear infinite reverse;
      }

      #boda-static-loading h2 {
        margin: 1rem 0 0;
        font-size: clamp(1.25rem, 3vw, 1.8rem);
      }

      #boda-static-loading-detail {
        margin: 0.45rem 0 1.1rem;
        color: #c8c8d0;
        font-size: 0.76rem;
      }

      .boda-static-progress {
        width: 100%;
        height: 0.7rem;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        background: #09090c;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.6);
      }

      .boda-static-progress span {
        display: block;
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #a50f30, #f12b55);
      }

      .boda-static-percent {
        margin-top: 0.55rem;
        color: #fff;
        font-size: 0.9rem;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      #boda-static-message {
        margin: 1rem 0 0;
        color: #ffb3c3;
        font-size: 0.76rem;
      }

      #boda-static-retry,
      #boda-static-cancel {
        min-width: 9rem;
        min-height: 2.7rem;
        padding: 0.55rem 1rem;
        margin-top: 0.8rem;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 10px;
        background: linear-gradient(180deg, #ff5577, #d4143b);
        color: #fff;
        font: inherit;
        font-size: 0.78rem;
        font-weight: 800;
        cursor: pointer;
      }

      #boda-static-cancel {
        border-color: rgba(255, 255, 255, 0.18);
        background: linear-gradient(180deg, #3d3d47, #17171d);
      }

      [hidden] {
        display: none !important;
      }

      @keyframes boda-static-prompt {
        from {
          outline-color: rgba(255, 112, 142, 0.28);
          box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.2),
            inset 0 -1px 0 rgba(255, 56, 98, 0.26),
            0 4px 0 #650b24,
            0 12px 26px rgba(4, 4, 7, 0.58),
            0 0 14px rgba(241, 43, 85, 0.28),
            0 0 32px rgba(241, 43, 85, 0.12);
        }
        to {
          outline-color: rgba(255, 202, 214, 0.56);
          box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.28),
            inset 0 -1px 0 rgba(255, 73, 112, 0.44),
            0 4px 0 #650b24,
            0 12px 26px rgba(4, 4, 7, 0.58),
            0 0 22px rgba(255, 255, 255, 0.18),
            0 0 42px rgba(241, 43, 85, 0.46);
        }
      }

      @keyframes boda-static-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 700px) {
        .boda-static-title__content {
          transform: translateY(-6vh);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boda-static-start,
        .boda-static-loader,
        .boda-static-loader::after {
          animation: none;
        }

        #boda-static-start,
        #boda-static-start::after,
        .boda-static-start__rail {
          transition: none;
        }
      }

      @media (forced-colors: active) {
        #boda-static-start {
          border-color: ButtonText;
          outline-color: ButtonText;
          background: Canvas;
          box-shadow: none;
          color: ButtonText;
        }

        .boda-static-start__rail,
        .boda-static-start__rail:last-child {
          background: ButtonText;
          box-shadow: none;
        }

        #boda-static-start::after {
          display: none;
        }

        #boda-static-start:focus-visible {
          outline-color: Highlight;
        }
      }

      /* Portrait-only gate for touch devices. Toggled by the inline script
         below the #root element; no CSS orientation query on purpose — the
         script requires the physical rotation AND the viewport aspect to
         agree, which a media query cannot express. */
      #boda-orientation-gate {
        position: fixed;
        z-index: 2000;
        inset: 0;
        display: none;
        background: #09090c;
        color: #f7f7fa;
        font-family:
          'Arial Rounded MT Bold', 'Trebuchet MS', 'Noto Sans KR', system-ui,
          sans-serif;
      }

      #boda-orientation-gate[data-active] {
        display: grid;
        place-items: center;
      }

      .boda-orientation-gate__content {
        padding: 2rem;
        text-align: center;
      }

      .boda-orientation-gate__icon {
        display: block;
        width: 2.1rem;
        height: 3.4rem;
        margin: 0 auto 1.2rem;
        border: 3px solid #d81f4d;
        border-radius: 0.55rem;
        animation: boda-orientation-rotate 1.6s ease-in-out infinite;
        /* Ends upright: the phone settles into portrait. */
      }

      #boda-orientation-gate strong {
        display: block;
        font-size: 1.15rem;
        letter-spacing: 0.02em;
      }

      #boda-orientation-gate p {
        margin: 0.55rem 0 0;
        color: #c8c8d0;
        font-size: 0.82rem;
      }

      @keyframes boda-orientation-rotate {
        0%,
        20% {
          transform: rotate(90deg);
        }

        55%,
        100% {
          transform: rotate(0deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boda-orientation-gate__icon {
          animation: none;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CoiSFxcA.js"></script>
  </head>
  <body>
    <div id="boda-static-title" aria-label="BODA 타이틀 화면">
      <picture aria-hidden="true">
        <source
          media="(max-width: 700px)"
          srcset="./assets/ui/title-boda-mobile.webp"
        />
        <img
          src="./assets/ui/title-boda-desktop.webp"
          alt=""
          width="1920"
          height="1080"
          fetchpriority="high"
        />
      </picture>
      <section class="boda-static-title__content">
        <p class="boda-static-title__eyebrow">THE LAST GAZE</p>
        <h1 class="boda-static-title__name">BODA</h1>
        <p class="boda-static-title__subtitle">눈을 거두면, 사냥이 시작된다</p>
        <button id="boda-static-start" type="button">
          <span class="boda-static-start__rail" aria-hidden="true"></span>
          <span class="boda-static-start__label">여기를 눌러 시작</span>
          <span class="boda-static-start__rail" aria-hidden="true"></span>
        </button>
      </section>
      <section
        id="boda-static-loading"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        aria-busy="true"
        tabindex="-1"
        hidden
      >
        <div class="boda-static-loader" aria-hidden="true"></div>
        <h2>게임 로딩 중</h2>
        <p id="boda-static-loading-detail">게임 코드 불러오기</p>
        <div
          class="boda-static-progress"
          role="progressbar"
          aria-label="게임 로딩 진행률"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span></span>
        </div>
        <output class="boda-static-percent">0%</output>
        <p id="boda-static-message" role="alert" hidden></p>
        <button id="boda-static-retry" type="button" hidden>다시 시도</button>
        <button id="boda-static-cancel" type="button">타이틀로 돌아가기</button>
      </section>
    </div>
    <div id="root" inert aria-hidden="true"></div>
    <div id="boda-orientation-gate" role="status">
      <div class="boda-orientation-gate__content">
        <span class="boda-orientation-gate__icon" aria-hidden="true"></span>
        <strong>가로모드는 지원하지 않습니다</strong>
        <p>기기를 세로로 회전해 주세요</p>
      </div>
    </div>
    <script>
      ;(() => {
        const gate = document.getElementById('boda-orientation-gate')
        if (!gate || typeof window.matchMedia !== 'function') return
        const coarseQuery = window.matchMedia('(pointer: coarse)')

        // Both signals must agree: the viewport alone is faked by Android's
        // soft keyboard (portrait seed input squashes it wide), and
        // screen.orientation alone is faked by split-screen windows and
        // partial emulators. Without the API the viewport decides (iOS
        // below 16.4 keeps innerHeight stable under the keyboard).
        const isLandscape = () => {
          const wide = window.innerWidth > window.innerHeight
          const type = window.screen?.orientation?.type
          if (typeof type === 'string')
            return type.indexOf('landscape') === 0 && wide
          return wide
        }

        const update = () => {
          if (coarseQuery.matches && isLandscape()) {
            gate.setAttribute('data-active', 'true')
          } else {
            gate.removeAttribute('data-active')
          }
        }

        const orientation = window.screen?.orientation
        if (orientation && typeof orientation.addEventListener === 'function') {
          orientation.addEventListener('change', update)
        }
        window.addEventListener('orientationchange', update)
        window.addEventListener('resize', update)
        if (typeof coarseQuery.addEventListener === 'function') {
          coarseQuery.addEventListener('change', update)
        } else if (typeof coarseQuery.addListener === 'function') {
          coarseQuery.addListener(update)
        }
        update()
      })()
    </script>
    <script>
      ;(() => {
        const title = document.getElementById('boda-static-title')
        const start = document.getElementById('boda-static-start')
        const loading = document.getElementById('boda-static-loading')
        let startupFailed = false
        let startupErrorShown = false
        let startupWatchdog

        const clearStartupTimer = () => {
          if (startupWatchdog !== undefined) {
            window.clearTimeout(startupWatchdog)
            startupWatchdog = undefined
          }
        }

        const clearStartupWatchdog = () => {
          clearStartupTimer()
          window.removeEventListener('error', handleStartupResourceError, true)
          window.removeEventListener(
            'unhandledrejection',
            handleStartupRejection,
          )
        }

        const showStartupError = (
          detailText = '게임 코드를 불러오지 못했습니다.',
          messageText = '연결을 확인한 뒤 다시 시도해 주세요.',
        ) => {
          startupFailed = true
          if (!window.__BODA_START_REQUESTED__ || startupErrorShown) return
          startupErrorShown = true
          clearStartupWatchdog()
          const detail = document.getElementById('boda-static-loading-detail')
          const message = document.getElementById('boda-static-message')
          const retry = document.getElementById('boda-static-retry')
          const loader = document.querySelector('.boda-static-loader')
          if (detail) detail.textContent = detailText
          if (message) {
            message.textContent = messageText
            message.hidden = false
          }
          if (loader) loader.hidden = true
          if (loading) loading.setAttribute('aria-busy', 'false')
          if (retry instanceof HTMLButtonElement) {
            retry.hidden = false
            retry.addEventListener('click', () => window.location.reload(), {
              once: true,
            })
            retry.focus()
          }
        }

        const armStartupWatchdog = () => {
          clearStartupTimer()
          startupWatchdog = window.setTimeout(() => {
            startupWatchdog = undefined
            if (document.hidden) {
              armStartupWatchdog()
              return
            }
            showStartupError(
              '게임 시작이 예상보다 오래 걸립니다.',
              '다시 시도하면 타이틀부터 안전하게 시작합니다.',
            )
          }, 30_000)
        }

        window.__BODA_SHOW_STARTUP_ERROR__ = showStartupError
        window.__BODA_CLEAR_STARTUP_WATCHDOG__ = clearStartupWatchdog

        function handleStartupResourceError(event) {
          const target = event.target
          if (target instanceof HTMLScriptElement && target.type === 'module') {
            showStartupError()
          }
        }

        function handleStartupRejection() {
          showStartupError()
        }

        const detach = () => {
          start?.removeEventListener('click', handleClick)
        }

        const captureStart = () => {
          if (window.__BODA_START_REQUESTED__) return
          window.__BODA_START_REQUESTED__ = true
          detach()
          if (title) title.dataset.state = 'loading'
          if (start instanceof HTMLButtonElement) start.disabled = true
          if (loading) {
            loading.hidden = false
            loading.focus({ preventScroll: true })
          }

          if (startupFailed) showStartupError()
          else armStartupWatchdog()

          if (!window.__BODA_PRIMED_AUDIO_CONTEXT__) {
            const AudioContextConstructor =
              window.AudioContext || window.webkitAudioContext
            if (typeof AudioContextConstructor === 'function') {
              try {
                const context = new AudioContextConstructor()
                window.__BODA_PRIMED_AUDIO_CONTEXT__ = context
                context.resume().catch(() => undefined)
              } catch {
                // The runtime keeps its silent-audio fallback.
              }
            }
          }
          window.dispatchEvent(new Event('boda:start'))
        }

        function handleClick() {
          captureStart()
        }

        window.addEventListener('error', handleStartupResourceError, true)
        window.addEventListener('unhandledrejection', handleStartupRejection)
        start?.addEventListener('click', handleClick)
        document
          .getElementById('boda-static-cancel')
          ?.addEventListener('click', () => window.location.reload())
      })()
    </script>
  </body>
</html>
