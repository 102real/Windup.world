    <script>
      ;(() => {
        const title = document.getElementById('stillseen-static-title')
        const start = document.getElementById('stillseen-static-start')
        const loading = document.getElementById('stillseen-static-loading')
        let startupFailed = false
        let startupErrorShown = false
        let startupWatchdog

        const clearStartupTimer = () => {
          if (startupWatchdog !== undefined) {
            window.clearTimeout(startupWatchdog)
            startupWatchdog = undefined
          }
        }

        const clearStartupWatchdog = () => {
          clearStartupTimer()
          window.removeEventListener('error', handleStartupResourceError, true)
          window.removeEventListener(
            'unhandledrejection',
            handleStartupRejection,
          )
        }

        const showStartupError = (
          detailText = '게임 코드를 불러오지 못했습니다.',
          messageText = '연결을 확인한 뒤 다시 시도해 주세요.',
        ) => {
          startupFailed = true
          if (!window.__STILLSEEN_START_REQUESTED__ || startupErrorShown) return
          startupErrorShown = true
          clearStartupWatchdog()
          const detail = document.getElementById(
            'stillseen-static-loading-detail',
          )
          const message = document.getElementById('stillseen-static-message')
          const retry = document.getElementById('stillseen-static-retry')
          const loader = document.querySelector('.stillseen-static-loader')
          if (detail) detail.textContent = detailText
          if (message) {
            message.textContent = messageText
            message.hidden = false
          }
          if (loader) loader.hidden = true
          if (loading) loading.setAttribute('aria-busy', 'false')
          if (retry instanceof HTMLButtonElement) {
            retry.hidden = false
            retry.addEventListener('click', () => window.location.reload(), {
              once: true,
            })
            retry.focus()
          }
        }

        const armStartupWatchdog = () => {
          clearStartupTimer()
          startupWatchdog = window.setTimeout(() => {
            startupWatchdog = undefined
            if (document.hidden) {
              armStartupWatchdog()
              return
            }
            showStartupError(
              '게임 시작이 예상보다 오래 걸립니다.',
              '다시 시도하면 타이틀부터 안전하게 시작합니다.',
            )
          }, 30_000)
        }

        window.__STILLSEEN_SHOW_STARTUP_ERROR__ = showStartupError
        window.__STILLSEEN_CLEAR_STARTUP_WATCHDOG__ = clearStartupWatchdog

        function handleStartupResourceError(event) {
          const target = event.target
          if (target instanceof HTMLScriptElement && target.type === 'module') {
            showStartupError()
          }
        }

        function handleStartupRejection() {
          showStartupError()
        }

        const detach = () => {
          start?.removeEventListener('click', handleClick)
        }

        const captureStart = () => {
          if (window.__STILLSEEN_START_REQUESTED__) return
          window.__STILLSEEN_START_REQUESTED__ = true
          detach()
          if (title) title.dataset.state = 'loading'
          if (start instanceof HTMLButtonElement) start.disabled = true
          if (loading) {
            loading.hidden = false
            loading.focus({ preventScroll: true })
          }

          if (startupFailed) showStartupError()
          else armStartupWatchdog()

          if (!window.__STILLSEEN_PRIMED_AUDIO_CONTEXT__) {
            const AudioContextConstructor =
              window.AudioContext || window.webkitAudioContext
            if (typeof AudioContextConstructor === 'function') {
              try {
                const context = new AudioContextConstructor()
                window.__STILLSEEN_PRIMED_AUDIO_CONTEXT__ = context
                context.resume().catch(() => undefined)
              } catch {
                // The runtime keeps its silent-audio fallback.
              }
            }
          }
          window.dispatchEvent(new Event('stillseen:start'))
        }

        function handleClick() {
          captureStart()
        }

        window.addEventListener('error', handleStartupResourceError, true)
        window.addEventListener('unhandledrejection', handleStartupRejection)
        start?.addEventListener('click', handleClick)
        document
          .getElementById('stillseen-static-cancel')
          ?.addEventListener('click', () => window.location.reload())
      })()
    </script>
